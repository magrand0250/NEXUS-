name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build console game
        run: dotnet build nexus_v2.csproj --configuration Release "-p:DefaultItemExcludes=**/bin/**;**/obj/**;**/NEXUS.windowsforms/**"

      - name: Build Windows Forms app
        run: dotnet build NEXUS.windowsforms/NEXUS.windowsforms.csproj --configuration Release
